# Bridge entries for worlds with dynamic obstacle dyn_box_1 (avoid_dynamic_*).
- ros_topic_name: "/model/dyn_box_1/cmd_vel"
  gz_topic_name: "/model/dyn_box_1/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
- ros_topic_name: "/ground_truth/model/dyn_box_1"
  gz_topic_name: "/model/dyn_box_1/ground_truth_odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

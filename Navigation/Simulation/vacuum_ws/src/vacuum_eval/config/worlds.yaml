# Evaluation world registry (docs/specs/09_worlds.md section 9.7).
# <share> is resolved via the ament index (vacuum_gazebo share dir) at runtime.
# Spawn candidates / goals are verified by test/test_worlds_yaml.py against the GT rasteriser.
# Dev/test split (docs/specs/13_preregistration.md). Dev = tuning allowed; test = frozen, run only via
# run_batch.py --split test --confirm-test-split. Reasoning: dev holds the simplest/most-familiar layouts
# (apartment is the tuning world; empty/cluttered room are single-room baselines; avoid_head_on, avoid_cluster,
# avoid_narrow_gap_wide, avoid_dynamic_cross are the easier or already-iterated avoidance scenarios). Test holds
# the structurally hard layouts (loops, symmetry, dead ends, doors) and the hardest avoidance variants
# (narrow gap, u-trap, dead end, sudden dynamic obstacle) so tuning cannot overfit them.
# avoid_* worlds have no entry under `worlds:` (no spawn/goal lists), so their split lives here.
splits:
  dev: [apartment, empty_room, cluttered_room, avoid_head_on, avoid_cluster, avoid_narrow_gap_wide, avoid_dynamic_cross]
  test: [office, corridor, two_rooms_door, multi_room_loop, maze_dead_ends, symmetric_hall, avoid_narrow_gap, avoid_u_trap, avoid_dead_end, avoid_dynamic_sudden]
seeds:
  dev: [1, 2, 3, 4, 5]
  test: [101, 102, 103, 104, 105, 106, 107, 108, 109, 110]
worlds:
  apartment:
    split: dev
    sdf_file: <share>/vacuum_gazebo/worlds/apartment.sdf
    world_name_in_sdf: apartment_world
    timeout_sim_sec: 1200
    reachable_seed: [0, 1]
    spawn_candidates:
      - [0, 1]
      - [0, -1]
      - [-2, -1.5]
      - [1, 1.8]
      - [-0.5, 2]
      - [1, -0.8]
      - [2.6, 1.8]
      - [-2.5, -0.5]
      - [0.5, -1.5]
    wall_models: "^wall_|^ceiling$"
    goal_lists:
      fixed:
        - [-2.5, -1.5, 0]
        - [2.5, 1.8, 0]
        - [0, 1.5, 1.5708]
        - [-2, -0.5, 0]
        - [0.5, -1.5, 0]
        - [2.5, -0.8, 3.1416]
  office:
    split: test
    sdf_file: <share>/vacuum_gazebo/worlds/office.sdf
    world_name_in_sdf: office_world
    timeout_sim_sec: 1200
    reachable_seed: [0, 0]
    spawn_candidates:

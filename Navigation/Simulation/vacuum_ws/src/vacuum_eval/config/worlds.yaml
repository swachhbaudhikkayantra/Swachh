      - [-2, 0]
      - [2, 0]
      - [-3, -0.3]
      - [3, 0.5]
      - [0, -2.5]
      - [-3, 1]
      - [3, 1]
      - [0, 1]
    wall_models: "^wall_|^ceiling$"
    goal_lists:
      fixed:
        - [-3.2, 0.5, 0]
        - [3.2, 0.5, 0]
        - [2.8, -2.4, 0]
        - [-3.2, -2.4, 0]
        - [0, 0.8, 0]
        - [-3.2, 1.5, 0]
  corridor:
    split: test
    sdf_file: <share>/vacuum_gazebo/worlds/corridor.sdf
    world_name_in_sdf: corridor_world
    timeout_sim_sec: 900
    reachable_seed: [0, 0]
    spawn_candidates:
      - [0, 0]
      - [-5, 0]
      - [-3.5, 0]
      - [-2, 0.3]
      - [2, 0]
      - [3.5, 0]
      - [5, 0]
      - [-4, -0.5]
      - [4, 0.3]
      - [1.5, -0.5]
    wall_models: "^wall_|^ceiling$"
    goal_lists:

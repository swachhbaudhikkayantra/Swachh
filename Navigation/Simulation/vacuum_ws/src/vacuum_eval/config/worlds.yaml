# Evaluation world registry (docs/specs/09_worlds.md section 9.7).
# <share> is resolved via the ament index (vacuum_gazebo share dir) at runtime.
# Spawn candidates / goals are verified by test/test_worlds_yaml.py against the GT rasteriser.
worlds:
  apartment:
    sdf_file: <share>/vacuum_gazebo/worlds/apartment.sdf
    world_name_in_sdf: apartment_world
    timeout_sim_sec: 1200
    reachable_seed: [0, 1]
    spawn_candidates:
      - [0, 1]
      - [0, -1]
      - [-2, -1.5]
      - [1, 1.8]
      - [-0.5, 2]
      - [1, -0.8]
      - [2.6, 1.8]
      - [-2.5, -0.5]
      - [0.5, -1.5]
    wall_models: "^wall_|^ceiling$"
    goal_lists:
      fixed:
        - [-2.5, -1.5, 0]
        - [2.5, 1.8, 0]
        - [0, 1.5, 1.5708]
        - [-2, -0.5, 0]
        - [0.5, -1.5, 0]
        - [2.5, -0.8, 3.1416]

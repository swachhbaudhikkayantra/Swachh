# Obstacle-avoidance scenario worlds (spec 09 9.5-9.7). Coordinates in world frame.
worlds:
  avoid_head_on:
    sdf_file: vacuum_gazebo/worlds/avoid_head_on.sdf
    world_name_in_sdf: avoid_head_on_world
    timeout_sim_sec: 120
    reachable_seed: [-2, 0]
    wall_models: "^wall_|^ceiling$"
    scenario:
      start: [-2, 0, 0.0]
      goal: [2, 0, 0.0]
